<div>{% include('header.html') %}</div>

<form method="POST" action="crear-articulo" enctype="multipart/form-data">

    <div>
        <H2>Crear articulo</H2>
    </div>
    {% with messages= get_flashed_messages() %}

    {% if messages %}
        <div>
            {% for message in messages %}
                <div style="display: flex; justify-content: center;">
                    <div style="background-color: red; border-radius: 15px; border: 20px; border-color: brown; text-align: center; color: aliceblue; padding: 15px;">{{ message }}</div>
                </div>
            {% endfor %}
        </div> <br>
    {% endif %}

{% endwith %}
    <div>
        <label for="">Nombre:</label>
        <input type="text" name="artNombre" id="artNombre"><br>

        <label for="">Imagen:</label>
        <input type="file" name="artImagen" id="artImagen"><br>

        <label for="">Precio</label>
        <input type="number" step="0.01" name="artPrecio" id="artPrecio" min="0"><br> <!-- El atributo step="0.01" determina el numero de decimales que maneja el campo -->

        <label for="">Stock:</label>
        <input type="number" name="artStock" id="artStock" min="0"><br>

        <div>
            <button type="submit">Agregar</button>
            <a href="{{url_for('admin')}}">Regresar</a>
        </div>
        
    </div>
    
</form>

<div>{% include('footer.html') %}</div>
